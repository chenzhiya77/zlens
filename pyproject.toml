[project]
name = "zlens"
version = "0.1.0"
description = "Local-first token usage & cost analytics for coding agents (v1 data source: ZCode)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default: tests touching the real ~/.zcode database are marked `live`.
addopts = "-m 'not live'"
markers = [
    "live: touches the real ~/.zcode/cli/db/db.sqlite (excluded by default)",
]
